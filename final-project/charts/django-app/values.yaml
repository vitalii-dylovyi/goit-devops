# Docker image pushed to ECR
# repository is empty on purpose: the Jenkins pipeline rewrites it (and tag)
# with the real ECR URL, or supply it via helm --set image.repository=<ECR_URL>
image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

# Number of replicas (overridden by the HPA once it is active)
replicaCount: 2

# Kubernetes Service
service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

# Container resource requests/limits (requests are required for the HPA)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Non-sensitive environment variables -> ConfigMap.
# POSTGRES_USER/DB match the RDS module (username=postgres, db_name=myapp).
# POSTGRES_HOST is a placeholder: Argo CD overrides it with the real RDS endpoint.
config:
  POSTGRES_DB: myapp
  POSTGRES_USER: postgres
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SETTINGS_MODULE: study_project.settings

# Sensitive env -> rendered into a Kubernetes Secret (NOT a ConfigMap).
# Placeholders here are overridden at deploy time by Argo CD helm parameters
# (POSTGRES_PASSWORD and SECRET_KEY come from Terraform); never commit real values.
secretConfig:
  POSTGRES_PASSWORD: "CHANGE_ME"
  SECRET_KEY: "CHANGE_ME"

# Ingress (bonus, disabled by default)
ingress:
  enabled: false
  className: nginx
  host: django.example.com
  path: /
  pathType: Prefix
  tls: false
