services:
  web:
    build: .
    container_name: django
    command: sh -c "python manage.py migrate && gunicorn study_project.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    expose:
      - "8000"
    environment:
      - POSTGRES_DB=study_db
      - POSTGRES_USER=study_user
      - POSTGRES_PASSWORD=study_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_DB=study_db
      - POSTGRES_USER=study_user
      - POSTGRES_PASSWORD=study_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
