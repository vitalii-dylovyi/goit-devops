# Docker image pushed to ECR
image:
  repository: 710353053240.dkr.ecr.us-west-2.amazonaws.com/lesson-8-9-ecr
  tag: latest
  pullPolicy: IfNotPresent

# Number of replicas (overridden by the HPA once it is active)
replicaCount: 2

# Kubernetes Service
service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

# Container resource requests/limits (requests are required for the HPA)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Environment variables -> ConfigMap (migrated from theme 4)
config:
  POSTGRES_DB: study_db
  POSTGRES_USER: study_user
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  DJANGO_SETTINGS_MODULE: study_project.settings

# Sensitive env -> rendered into a Kubernetes Secret (NOT a ConfigMap).
# Override in production via ArgoCD/helm --set or a SealedSecret; do not commit real values.
secretConfig:
  POSTGRES_PASSWORD: "CHANGE_ME"

# Ingress (bonus, disabled by default)
ingress:
  enabled: false
  className: nginx
  host: django.example.com
  path: /
  pathType: Prefix
  tls: false
